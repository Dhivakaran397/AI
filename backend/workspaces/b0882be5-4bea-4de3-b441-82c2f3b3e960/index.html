<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList Component - React Web App</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React & Babel Standalone CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(15, 23, 42, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-completed: #64748b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #10b981;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --danger-glow: rgba(239, 68, 68, 0.25);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e0e7ff 50%, #f1f5f9 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.08);
            --input-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-completed: #94a3b8;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        #root {
            width: 100%;
            max-width: 640px;
        }

        /* App Container */
        .todo-app {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 2.25rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        /* Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.75rem;
        }

        .app-title-group h1 {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .app-title-group p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            font-weight: 500;
        }

        .theme-toggle {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: rotate(15deg) scale(1.05);
            border-color: var(--primary);
        }

        /* Stats Counter Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 0.85rem 1rem;
            text-align: center;
            transition: var(--transition);
        }

        .stat-card .stat-val {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .stat-card .stat-lbl {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.2rem;
        }

        /* Form Area */
        .task-form {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1.1rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            pointer-events: none;
        }

        .task-input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.75rem;
            background: var(--input-bg);
            border: 1.5px solid var(--card-border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: var(--transition);
        }

        .task-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .task-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .btn-add {
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            padding: 0 1.35rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
            white-space: nowrap;
        }

        .btn-add:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px var(--primary-glow);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        /* Controls & Filter Bar */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        .filter-tabs {
            display: flex;
            background: var(--input-bg);
            padding: 0.25rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            gap: 0.25rem;
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.45rem 0.85rem;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn:hover {
            color: var(--text-main);
        }

        .filter-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 2px 8px var(--primary-glow);
        }

        .btn-clear {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 0.45rem 0.75rem;
            font-size: 0.78rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-clear:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.3);
        }

        /* Task List */
        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 0.2rem;
        }

        .task-list::-webkit-scrollbar {
            width: 5px;
        }

        .task-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .task-list::-webkit-scrollbar-thumb {
            background: var(--card-border);
            border-radius: 10px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 0.85rem 1rem;
            gap: 0.85rem;
            transition: var(--transition);
            animation: slideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-item:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(2px);
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            flex: 1;
            cursor: pointer;
            min-width: 0;
            user-select: none;
        }

        .checkbox-custom {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .task-item.completed .checkbox-custom {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .checkbox-custom i {
            font-size: 0.7rem;
            opacity: 0;
            transform: scale(0.4);
            transition: var(--transition);
        }

        .task-item.completed .checkbox-custom i {
            opacity: 1;
            transform: scale(1);
        }

        .task-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-main);
            transition: var(--transition);
            word-break: break-word;
            line-height: 1.4;
        }

        /* Completed Task Styling as specified in requirement 4 */
        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-completed);
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.7;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .task-item:hover .btn-delete {
            opacity: 1;
        }

        .btn-delete:hover {
            background: var(--danger-glow);
            color: var(--danger);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3.5rem 1rem;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.35;
            color: var(--primary);
        }

        .empty-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: var(--text-main);
        }

        .empty-desc {
            font-size: 0.85rem;
        }

        /* Footer */
        .app-footer {
            margin-top: 1.75rem;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            border-top: 1px solid var(--card-border);
            padding-top: 1rem;
        }

        @media (max-width: 480px) {
            .todo-app {
                padding: 1.5rem 1.25rem;
            }
            .task-form {
                flex-direction: column;
            }
            .btn-add {
                justify-content: center;
                padding: 0.85rem;
            }
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-tabs {
                justify-content: center;
            }
            .btn-clear {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    /**
     * Single React Functional Component: TodoList
     * Fully implements task creation, deletion, completion toggle, state management,
     * filter views, enter key handling, empty state display, and responsive UI.
     */
    function TodoList() {
        // 1. State Management: useState for task list with localStorage persistence fallback
        const [tasks, setTasks] = useState(() => {
            const saved = localStorage.getItem('todo_list_tasks');
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (e) {
                    console.error("Failed to load saved tasks", e);
                }
            }
            // Default initial tasks
            return [
                { id: Date.now() - 2000, text: 'Welcome to TaskMaster! Click task text to toggle complete.', completed: false },
                { id: Date.now() - 1000, text: 'Type a new task above and click "Add" or press Enter.', completed: false },
                { id: Date.now(), text: 'Click the trash icon to delete a task.', completed: true }
            ];
        });

        const [text, setText] = useState('');
        const [filter, setFilter] = useState('all');
        const [theme, setTheme] = useState('dark');

        // LocalStorage Sync
        useEffect(() => {
            localStorage.setItem('todo_list_tasks', JSON.stringify(tasks));
        }, [tasks]);

        // Theme Attribute Toggle
        useEffect(() => {
            document.documentElement.setAttribute('data-theme', theme);
        }, [theme]);

        const toggleTheme = () => {
            setTheme(prev => prev === 'dark' ? 'light' : 'dark');
        };

        // 2. Add Task Handler
        const handleAddTask = (e) => {
            if (e) e.preventDefault();
            const trimmedText = text.trim();
            if (!trimmedText) return;

            const newTask = {
                id: Date.now(),
                text: trimmedText,
                completed: false
            };

            setTasks(prevTasks => [newTask, ...prevTasks]);
            setText(''); // Clear input field after adding
        };

        // Enter key handler
        const handleKeyDown = (e) => {
            if (e.key === 'Enter') {
                handleAddTask(e);
            }
        };

        // 3. Delete Task Handler
        const deleteTask = (id) => {
            setTasks(prevTasks => prevTasks.filter(task => task.id !== id));
        };

        // 4. Toggle Task Completion Handler
        const toggleTask = (id) => {
            setTasks(prevTasks => prevTasks.map(task => 
                task.id === id ? { ...task, completed: !task.completed } : task
            ));
        };

        // Clear Completed Tasks
        const clearCompleted = () => {
            setTasks(prevTasks => prevTasks.filter(task => !task.completed));
        };

        // Filter Logic
        const filteredTasks = tasks.filter(task => {
            if (filter === 'active') return !task.completed;
            if (filter === 'completed') return task.completed;
            return true;
        });

        const completedCount = tasks.filter(t => t.completed).length;
        const activeCount = tasks.length - completedCount;

        return (
            <div className="todo-app">
                {/* Header Section */}
                <header className="app-header">
                    <div className="app-title-group">
                        <h1>
                            <i className="fa-solid fa-list-check"></i> TodoList
                        </h1>
                        <p>Organize your goals & daily tasks</p>
                    </div>
                    <button 
                        className="theme-toggle" 
                        onClick={toggleTheme}
                        title={`Switch to ${theme === 'dark' ? 'light' : 'dark'} mode`}
                        aria-label="Toggle Theme"
                    >
                        <i className={`fa-solid ${theme === 'dark' ? 'fa-sun' : 'fa-moon'}`}></i>
                    </button>
                </header>

                {/* Task Stats Bar */}
                <div className="stats-bar">
                    <div className="stat-card">
                        <div className="stat-val">{tasks.length}</div>
                        <div className="stat-lbl">Total</div>
                    </div>
                    <div className="stat-card">
                        <div className="stat-val" style={{ color: 'var(--primary)' }}>{activeCount}</div>
                        <div className="stat-lbl">Pending</div>
                    </div>
                    <div className="stat-card">
                        <div className="stat-val" style={{ color: 'var(--accent)' }}>{completedCount}</div>
                        <div className="stat-lbl">Completed</div>
                    </div>
                </div>

                {/* Add Task Input Form */}
                <form className="task-form" onSubmit={handleAddTask}>
                    <div className="input-wrapper">
                        <i className="fa-solid fa-pen input-icon"></i>
                        <input
                            type="text"
                            className="task-input"
                            placeholder="Add a new task..."
                            value={text}
                            onChange={(e) => setText(e.target.value)}
                            onKeyDown={handleKeyDown}
                        />
                    </div>
                    <button type="submit" className="btn-add">
                        <i className="fa-solid fa-plus"></i> Add Task
                    </button>
                </form>

                {/* Filter & Action Bar */}
                <div className="controls-bar">
                    <div className="filter-tabs">
                        <button 
                            className={`filter-btn ${filter === 'all' ? 'active' : ''}`}
                            onClick={() => setFilter('all')}
                        >
                            All ({tasks.length})
                        </button>
                        <button 
                            className={`filter-btn ${filter === 'active' ? 'active' : ''}`}
                            onClick={() => setFilter('active')}
                        >
                            Active ({activeCount})
                        </button>
                        <button 
                            className={`filter-btn ${filter === 'completed' ? 'active' : ''}`}
                            onClick={() => setFilter('completed')}
                        >
                            Completed ({completedCount})
                        </button>
                    </div>

                    {completedCount > 0 && (
                        <button className="btn-clear" onClick={clearCompleted}>
                            <i className="fa-solid fa-broom"></i> Clear Completed
                        </button>
                    )}
                </div>

                {/* 5. Display Tasks: Unordered List / Empty State */}
                {filteredTasks.length > 0 ? (
                    <ul className="task-list">
                        {filteredTasks.map(task => (
                            <li 
                                key={task.id} 
                                className={`task-item ${task.completed ? 'completed' : ''}`}
                            >
                                <div className="task-content" onClick={() => toggleTask(task.id)}>
                                    <div className="checkbox-custom">
                                        <i className="fa-solid fa-check"></i>
                                    </div>
                                    <span className="task-text">{task.text}</span>
                                </div>
                                <button 
                                    className="btn-delete" 
                                    onClick={() => deleteTask(task.id)}
                                    title="Delete task"
                                    aria-label="Delete task"
                                >
                                    <i className="fa-regular fa-trash-can"></i>
                                </button>
                            </li>
                        ))}
                    </ul>
                ) : (
                    <div className="empty-state">
                        <div className="empty-icon">
                            <i className="fa-regular fa-calendar-check"></i>
                        </div>
                        <div className="empty-title">
                            {filter === 'completed' 
                                ? 'No completed tasks found' 
                                : filter === 'active' 
                                ? 'No pending tasks remaining!' 
                                : 'No tasks available'}
                        </div>
                        <div className="empty-desc">
                            {filter === 'all' 
                                ? 'Use the input above to add your first task.' 
                                : 'Try switching filter views or creating new tasks.'}
                        </div>
                    </div>
                )}

                {/* Footer */}
                <footer className="app-footer">
                    React Functional Component &bull; Built for Modern Web Browsers
                </footer>
            </div>
        );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TodoList />);
</script>

</body>
</html>
