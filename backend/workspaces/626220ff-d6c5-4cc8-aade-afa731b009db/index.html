<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Calculator</title>
    <!-- Google Fonts - Poppins for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* General Reset & Base Styles */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); /* Dark gradient background */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden; /* Prevent scrollbar for aesthetic background */
            position: relative;
        }

        /* Calculator Container - Glassmorphism Effect */
        .calculator-container {
            background: rgba(45, 45, 45, 0.6); /* Dark translucent background */
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1); /* Subtle white border */
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); /* Stronger shadow for depth */
            backdrop-filter: blur(10px) saturate(180%); /* Key glassmorphism blur and saturation */
            -webkit-backdrop-filter: blur(10px) saturate(180%); /* Safari support */
            padding: 20px;
            width: 90%;
            max-width: 360px; /* Optimal width for a calculator */
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 columns for buttons */
            grid-gap: 15px; /* Spacing between buttons */
            position: relative;
            z-index: 10; /* Ensure calculator is above any background elements */
            animation: fadeIn 0.8s ease-out; /* Smooth fade in */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Display Screen */
        .calculator-display {
            grid-column: 1 / -1; /* Spans all 4 columns */
            background: rgba(30, 30, 30, 0.7); /* Slightly darker translucent background */
            border-radius: 10px;
            padding: 20px 15px;
            text-align: right;
            word-wrap: break-word;
            word-break: break-all;
            margin-bottom: 15px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.4); /* Inner shadow for depth */
            min-height: 100px; /* Ensure a decent height */
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            transition: background 0.3s ease-in-out;
        }

        .calculator-display .previous-operand {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            min-height: 25px; /* Prevent layout shift when empty */
            transition: font-size 0.2s ease-out;
        }

        .calculator-display .current-operand {
            color: #fff;
            font-size: 2.5rem;
            min-height: 40px; /* Prevent layout shift when empty */
            transition: font-size 0.2s ease-out;
            /* Animation applied dynamically via JS */
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Buttons */
        .calculator-container button {
            background: rgba(70, 70, 70, 0.5); /* Translucent button background */
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 1.5rem;
            padding: 15px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease-in-out; /* Smooth transitions for hover/active */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); /* Button shadow */
        }

        .calculator-container button:hover {
            background: rgba(90, 90, 90, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .calculator-container button:active {
            background: rgba(50, 50, 50, 0.7);
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .calculator-container button.operator {
            background: rgba(255, 160, 0, 0.6); /* Orange translucent for operators */
            color: #fff;
        }

        .calculator-container button.operator:hover {
            background: rgba(255, 180, 0, 0.7);
        }

        .calculator-container button.operator:active {
            background: rgba(200, 140, 0, 0.7);
        }

        .calculator-container button.equals {
            grid-column: span 2; /* Equals button spans two columns */
            background: rgba(30, 144, 255, 0.7); /* Dodger blue translucent for equals */
            color: #fff;
            font-weight: 600;
        }

        .calculator-container button.equals:hover {
            background: rgba(60, 164, 255, 0.8);
        }

        .calculator-container button.equals:active {
            background: rgba(10, 124, 235, 0.8);
        }

        .calculator-container button.clear {
            background: rgba(220, 50, 50, 0.7); /* Red translucent for clear */
        }

        .calculator-container button.clear:hover {
            background: rgba(240, 70, 70, 0.8);
        }

        .calculator-container button.clear:active {
            background: rgba(190, 30, 30, 0.8);
        }

        .calculator-container button.span-two {
            grid-column: span 2; /* Custom class for the '0' button to span two columns */
        }

        /* Responsive Adjustments */
        @media (max-width: 400px) {
            .calculator-container {
                padding: 15px;
                grid-gap: 10px;
                max-width: 300px;
            }
            .calculator-display {
                padding: 15px 10px;
                margin-bottom: 10px;
            }
            .calculator-display .current-operand {
                font-size: 2rem;
            }
            .calculator-display .previous-operand {
                font-size: 1rem;
            }
            .calculator-container button {
                font-size: 1.2rem;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="calculator-display">
            <div data-previous-operand class="previous-operand"></div>
            <div data-current-operand class="current-operand">0</div>
        </div>
        <button data-clear class="clear">C</button>
        <button data-delete class="operator">DEL</button>
        <button data-operator class="operator">%</button>
        <button data-operator class="operator">/</button>
        <button data-number>7</button>
        <button data-number>8</button>
        <button data-number>9</button>
        <button data-operator class="operator">*</button>
        <button data-number>4</button>
        <button data-number>5</button>
        <button data-number>6</button>
        <button data-operator class="operator">-</button>
        <button data-number>1</button>
        <button data-number>2</button>
        <button data-number>3</button>
        <button data-operator class="operator">+</button>
        <button data-number class="span-two">0</button>
        <button data-number>.</button>
        <button data-equals class="equals">=</button>
    </div>

    <script>
        class Calculator {
            constructor(previousOperandTextElement, currentOperandTextElement) {
                this.previousOperandTextElement = previousOperandTextElement;
                this.currentOperandTextElement = currentOperandTextElement;
                this.clear();
            }

            clear() {
                this.currentOperand = '0'; // Start with 0 on display
                this.previousOperand = '';
                this.operation = undefined;
                this.equalsPressed = false; // Flag to reset currentOperand after an operation if number is pressed
            }

            delete() {
                if (this.currentOperand === '0') return; // Cannot delete the initial '0'
                if (this.currentOperand.length === 1) {
                    this.currentOperand = '0';
                } else {
                    this.currentOperand = this.currentOperand.toString().slice(0, -1);
                }
            }

            appendNumber(number) {
                // If equals was pressed and a number is entered, clear the calculator and start new input
                if (this.equalsPressed) {
                    this.clear();
                    this.equalsPressed = false;
                }

                // If currentOperand is '0' and a non-decimal number is pressed, replace '0'
                if (this.currentOperand === '0' && number !== '.') {
                    this.currentOperand = number.toString();
                    return;
                }

                // Prevent multiple decimal points
                if (number === '.' && this.currentOperand.includes('.')) return;
                this.currentOperand = this.currentOperand.toString() + number.toString();
            }

            chooseOperation(operation) {
                this.equalsPressed = false; // Reset equals flag when a new operation is chosen
                if (this.currentOperand === '') return; // Cannot choose operation if current operand is empty
                if (this.previousOperand !== '') {
                    this.compute(); // Compute previous operation if one exists
                }
                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.currentOperand = ''; // Clear current operand for next number input
            }

            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);

                // If either operand is not a number, cannot compute
                if (isNaN(prev) || isNaN(current)) return;

                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '*':
                        computation = prev * current;
                        break;
                    case '/':
                        computation = prev / current;
                        break;
                    case '%': // Modulo operator
                        computation = prev % current;
                        break;
                    default:
                        return; // No valid operation set
                }
                this.currentOperand = computation;
                this.operation = undefined;
                this.previousOperand = '';
            }

            // Helper to format numbers with commas
            getDisplayNumber(number) {
                const stringNumber = number.toString();
                const integerDigits = parseFloat(stringNumber.split('.')[0]);
                const decimalDigits = stringNumber.split('.')[1];
                let integerDisplay;
                if (isNaN(integerDigits)) {
                    integerDisplay = '';
                } else {
                    integerDisplay = integerDigits.toLocaleString('en', { maximumFractionDigits: 0 });
                }

                    return
