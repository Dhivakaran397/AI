version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dai
      POSTGRES_PASSWORD: dai_password
      POSTGRES_DB: dai
    ports:
      - "5432:5432"
    volumes:
      - dai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dai -d dai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dai-network

  redis:
    image: redis:7-alpine
    container_name: dai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dai-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://dai:dai_password@postgres:5432/dai
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - OPENAI_API_KEY=
      - OPENAI_BASE_URL=
      - DAI_WORKSPACE_DIR=/app/workspace
    volumes:
      - dai_workspace:/app/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - dai-network

volumes:
  dai_pgdata:
  dai_redis_data:
  dai_workspace:

networks:
  dai-network:
    driver: bridge
